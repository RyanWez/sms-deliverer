[package]
name = "sms-tauri"
version = "1.8.0"
edition = "2021"

[lib]
name = "sms_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is named explicitly even though `linux-libxdo` already turns it on
# as a side effect: `linux-libxdo = ["tray-icon/libxdo", …]` is written without
# the `?` sigil, so naming that optional dependency force-enables it. That is an
# accident of upstream's feature plumbing, not a promise — rewritten in the
# idiomatic form as `tray-icon?/libxdo` it would stop enabling anything and
# `tauri::tray` would vanish from this build on a caret bump. Declare what
# `lib.rs` actually uses. It is already enabled, so this pulls in no new crate.
tauri = { version = "2", features = ["linux-libxdo", "tray-icon"] }
tauri-plugin-dialog = "2"
# Registered first in `lib.rs`, and the reason is hardware. Closing the window
# hides the app to the tray with every serial port still open, so a second launch
# by an operator who believed they had quit would leave two processes contending
# for `/dev/ttyUSB*` — the newer one able to open nothing, showing a bank that
# looks dead while the older one is still reading it. The second instance hands
# focus to the first instead of starting a run.
tauri-plugin-single-instance = "2"
serialport = "4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
hex = "0.4"
directories = "5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# Already compiled into this binary via tauri-plugin-updater; declared directly
# so the Telegram forwarder can use it. The feature set deliberately mirrors the
# updater's (`default-features = false` + `rustls-no-provider`, which reuses the
# ring-backed rustls the updater already pulls) and adds only two things:
# `blocking`, because this crate's workers are OS threads doing blocking I/O
# rather than async tasks, and `socks`, which is what makes a `socks5h://` proxy
# work when an ISP blocks api.telegram.org.
#
# Do not switch this to default features. `default-tls` selects the aws-lc-rs
# crypto provider, which drags in aws-lc-sys and a cmake + C toolchain build step
# — 22 extra crates and a new way for the Windows CI leg to fail, for a TLS stack
# this binary already has.
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls-no-provider",
    "socks",
] }
# `rustls-no-provider` leaves the crypto provider to the process, and reqwest
# *panics* when it builds a client and none is installed. This is the same
# ring-backed rustls tauri-plugin-updater already depends on (and the same
# provider it installs for itself), so declaring it adds no crates — it makes the
# requirement explicit and lets `telegram::build_client` install it on its own
# instead of depending on the updater having run first.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
