name: build-check

# Pre-merge installer build. Proves the app still *bundles* — not just compiles —
# before a tag and a GitHub Release exist.
#
# Why this is a separate workflow instead of new triggers on tauri-build.yml:
#   tauri-build.yml exists to publish. Its job carries `permissions: contents:
#   write`, `fail-fast: true` ("publish must be all-or-nothing"), and passes
#   `tagName: ${{ github.ref_name }}` to tauri-action. On a pull_request or
#   workflow_dispatch run `github.event.release.id` is empty while
#   `github.ref_name` still resolves (to `<pr number>/merge` or a branch name) —
#   and tauri-action's own logic is "if tagName && !releaseId -> getOrCreateRelease",
#   i.e. it *creates* a release and tag from that value. Adding triggers there
#   would put an accidental publish one mis-authored `if:` away. This workflow
#   instead has no release code path at all: no tauri-action, no GITHUB_TOKEN in
#   any step env, `permissions: contents: read`, and the Tauri CLI invoked
#   directly. Nothing here can reach the Releases API.
#
# Signing: `bundle.createUpdaterArtifacts: true` + `plugins.updater.pubkey` in
# src-tauri/tauri.conf.json make the CLI's post-bundle `sign_updaters()` step
# mandatory, and it hard-errors without a key:
#   "A public key has been found, but no private key. Make sure to set
#    `TAURI_SIGNING_PRIVATE_KEY` environment variable."
# (tauri-cli 2.11.4 src/bundle.rs — the pubkey/private-key lookup runs for every
# nsis/msi/appimage/deb/rpm bundle.) `--no-sign` is checked *before* that lookup
# and returns early with "Updater signing is skipped due to --no-sign flag.", so
# the installers are still produced — only the `.sig` files are absent. That is
# exactly right for a build check: secrets are not available to fork PRs, and the
# signatures are only meaningful for artifacts that get published. The publish
# workflow keeps signing (it needs `.sig` files for latest.json; without them
# tauri-action logs "Signature not found for the updater JSON. Skipping upload"
# and the in-app updater breaks — Memory/02-release-automation.md §3).
#
# Triggers: `pull_request` -> main (the gate that matters: the release PR and
# every feature PR get a real bundle before merge) + `workflow_dispatch` (so a
# branch can be checked on demand without opening a PR). Deliberately NOT
# `push: '**'` like test.yml: two full Rust *release* builds plus NSIS/MSI/
# AppImage/deb/rpm packaging is the single most expensive thing this repo can ask
# a runner to do, and on a personal-project budget paying it on every
# work-in-progress push is not worth it. `cargo test` + `cargo check --release`
# in test.yml stay the fast per-push signal; this is the pre-merge signal.

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'Memory/**'
      - 'docs/**'
  workflow_dispatch:

# Keyed on the head commit, same as test.yml, so a re-push supersedes an
# in-flight bundle build instead of queueing a second hour of runner time.
concurrency:
  group: build-check-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  bundle:
    # Read-only: this workflow never writes a ref, a tag, a release or an asset.
    permissions:
      contents: read
    strategy:
      # Opposite of the publish workflow on purpose: nothing is uploaded
      # anywhere, so a Linux failure must not hide the Windows result. One run
      # should report both platforms.
      fail-fast: false
      # Same shape as test.yml's matrix — this is a check, not a publish, so it
      # needs no per-platform `args` the way tauri-action does.
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest']

    runs-on: ${{ matrix.platform }}
    # Matches tauri-build.yml: a cold release build + bundling of every target
    # for the platform does not fit in test.yml's 30.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Node 22, same pin as test.yml / tauri-build.yml: `beforeBuildCommand`
      # (`npm run build`) runs under this Node, so the frontend that gets bundled
      # here must be built by the version the tests ran under.
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Platform policy: Windows + Linux only — the matrix above must never gain
      # a macOS entry. See Memory/02-release-automation.md §5 Platform Policy.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Identical list to tauri-build.yml / test.yml — a build check that
      # installs a different set is not checking the publish build.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libxdo-dev

      - name: install frontend dependencies
        run: npm ci

      # The whole point of this workflow. `--no-sign` keeps it runnable without
      # the signing secrets (see header). No GITHUB_TOKEN is set in this step's
      # environment, so even a compromised dependency has no repo write path.
      - name: build installers (no signing, no publishing)
        run: npx tauri build --no-sign

      # Short retention: this is a throwaway artifact whose only job is to let a
      # human download one installer and actually run it before merging.
      - name: upload installers
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          # Each platform matches only its own subset of the globs above; an
          # empty upload means bundling silently produced nothing, which should
          # fail the check rather than pass with a 0-file artifact.
          if-no-files-found: error
          retention-days: 7
