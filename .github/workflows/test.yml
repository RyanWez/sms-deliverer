name: test

# Continuous Rust test job — runs independent of releases so regressions are
# caught on every push / PR instead of only when publishing artifacts.
#
# Note: tests are pure logic (no serial hardware required), so they run safely
# on hosted runners. See Memory/02-release-automation.md for the release flow.
#
# Triggers: `push` covers every branch so a feature branch gets CI even before a
# PR exists. The release-please branch is excluded — it already gets a
# `pull_request` run, and release-please.yml's sync-cargo-lock job pushes to it.
# `pull_request` is kept for fork PRs and required-check reporting; the
# concurrency group is keyed on the *head commit* (not the ref) so the push run
# and the pull_request run for the same commit collapse into one instead of
# burning two sets of runners.

on:
  push:
    branches:
      - '**'
      - '!release-please--branches--main--components--sms-tauri'
    paths-ignore:
      - '**.md'
      - 'Memory/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'Memory/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  cargo-test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-22.04', 'windows-latest']
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libxdo-dev

      - name: run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Release builds gate cfg(not(debug_assertions)) code paths (e.g. the
      # production file logger) that `cargo test` never compiles locally,
      # so make sure the release profile still builds cleanly.
      - name: check release profile compiles (linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo check --release --locked --manifest-path src-tauri/Cargo.toml

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node 22 is required: the frontend tests use the built-in test runner
      # plus --experimental-strip-types instead of a separate test framework.
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: type-check
        run: npm run check

      - name: run frontend tests
        run: npm test