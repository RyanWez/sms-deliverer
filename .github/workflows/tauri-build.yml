name: 'publish'

on:
  release:
    types: [published]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      # Publish must be all-or-nothing: with fail-fast disabled a failed Linux
      # leg would still let Windows upload, leaving a published release that
      # only ships one platform. (test.yml keeps fail-fast: false on purpose —
      # there we want both platforms' failures reported.)
      fail-fast: true
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Pinned to 22 to match test.yml: the frontend scripts rely on Node 22's
      # --experimental-strip-types, so publishing on lts/* could build with a
      # Node version the tests never ran under.
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Platform policy: Windows + Linux artifacts ONLY — the matrix above must
      # never gain a macOS entry (bundles come out per-OS from "targets": "all").
      # Rationale/evidence: Memory/02-release-automation.md §5 Platform Policy.
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libxdo-dev

      # `npm ci` (not `npm install`): every frontend dependency is a caret
      # range, so `npm install` can resolve newer versions than the committed
      # package-lock.json that test.yml validated, and ship them signed.
      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ github.event.release.id }}
          # The `notes` field of the generated latest.json is taken verbatim from
          # this input (tauri-action passes it straight to uploadVersionJSON), and
          # the in-app updater panel renders those notes. Without it the panel
          # offers an update with nothing to read. It does not rewrite the GitHub
          # release body: with releaseId set, tauri-action only uses the body for
          # the updater manifest.
          releaseBody: ${{ github.event.release.body }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true
